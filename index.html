<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel Dulca</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background-color: #f4f4f4; }
        .fullscreen-icon { position: fixed; bottom: 10px; font-size: 24px; cursor: pointer; background: white; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; border-radius: 50%; box-shadow: 0 0 5px rgba(0, 0, 0, 0.2); z-index: 10; }
        .fullscreen-icon { left: 10px; }
        #iframeContent { width: 100vw; height: 100vh; border: none; background: white; display: none; }
        .progress-bar-container { position: fixed; bottom: 0; left: 0; width: 100%; height: 8px; background-color: rgba(255, 0, 0, 0.2); }
        .progress-bar { width: 0%; height: 100%; background-color: rgba(255, 0, 0, 0.7); transition: width linear; }
        #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 100; }
        #loadingText { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 10px; }
        #loadingProgress { width: 80%; height: 10px; background: #ddd; border-radius: 5px; overflow: hidden; }
        #loadingBar { width: 0%; height: 100%; background: #ff5733; }
        #fullscreenPrompt { font-size: 18px; margin-top: 20px; cursor: pointer; background: rgba(255, 0, 0, 0.7); color: white; padding: 10px 20px; border-radius: 5px; border: none; }
    </style>
</head>
<body>

<div id="loadingScreen">
    <div id="loadingText">CARGANDO...</div>
    <div id="loadingProgress">
        <div id="loadingBar"></div>
    </div>
    <button id="fullscreenPrompt" onclick="requestFullscreen()">¿Desea poner a pantalla completa?</button>
</div>

<div class="fullscreen-icon" id="fullscreenIcon" onclick="toggleFullscreen()">⛶</div>
<iframe id="iframeContent"></iframe>
<div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
</div>

<script>
    let items = [];
    let currentIndex = 0;
    let timeoutId;
    let isFullscreenRequested = false;
    const iframeContent = document.getElementById("iframeContent");
    const progressBar = document.getElementById("progressBar");
    const loadingScreen = document.getElementById("loadingScreen");
    const loadingBar = document.getElementById("loadingBar");
    const fullscreenPrompt = document.getElementById("fullscreenPrompt");
    const fullscreenIcon = document.getElementById("fullscreenIcon");
    
    function cargarEnlacesDesdeJSON() {
        const urlJSON = "https://script.google.com/macros/s/AKfycbxmHNA0nIpFkFQ8BltSs2E3FUUSmM2U26UPC-QgQpWvVd4ibxlkj1nRPLEZbDsIBDif/exec";
        
        let progress = 0;
        let interval = setInterval(() => {
            progress += 5;
            loadingBar.style.width = progress + "%";
            if (progress >= 100) clearInterval(interval);
        }, 150);
        
        fetch(urlJSON)
            .then(response => response.json())
            .then(data => {
                clearInterval(interval);
                loadingBar.style.width = "100%";
                
                console.log("Datos cargados:", data);
                
                items = data.map(item => ({
                    url: item.url,
                    time: item.time || 5 
                })).filter(item => item.url);
                
                console.log("Datos procesados:", items);
                
                setTimeout(() => {
                    if (!isFullscreenRequested) {
                        loadingScreen.style.display = "none";
                        iframeContent.style.display = "block";
                        fullscreenIcon.style.display = document.fullscreenElement ? "none" : "flex";
                        updateContent();
                    }
                }, 500);
            })
            .catch(error => {
                clearInterval(interval);
                console.error("Error cargando el JSON:", error);
            });
    }

    function updateContent() {
        if (items.length === 0) {
            return;
        }
        let currentItem = items[currentIndex];
        console.log("Cargando enlace:", currentItem.url);
        
        iframeContent.src = currentItem.url;
        startProgressBar(currentItem.time);

        timeoutId = setTimeout(() => {
            currentIndex = (currentIndex + 1) % items.length;
            updateContent();
        }, currentItem.time * 1000);
    }

    function startProgressBar(duration) {
        progressBar.style.transition = "width 0s";
        progressBar.style.width = "0%";
        setTimeout(() => {
            progressBar.style.transition = `width ${duration}s linear`;
            progressBar.style.width = "100%";
        }, 50);
    }

    function requestFullscreen() {
        isFullscreenRequested = true;
        document.documentElement.requestFullscreen().then(() => {
            fullscreenPrompt.style.display = "none";
        }).catch(() => {
            isFullscreenRequested = false;
        });
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
            fullscreenIcon.style.display = "none";
        } else if (document.exitFullscreen) {
            document.exitFullscreen();
            fullscreenIcon.style.display = "flex";
        }
    }

    document.addEventListener("fullscreenchange", () => {
        fullscreenIcon.style.display = document.fullscreenElement ? "none" : "flex";
    });

    setInterval(cargarEnlacesDesdeJSON, 300000);
    window.onload = cargarEnlacesDesdeJSON;
</script>
</body>
</html>
